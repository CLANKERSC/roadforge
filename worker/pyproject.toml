[project]
name = "forge-worker"
version = "0.0.1"
description = "Local pipeline worker for the map-to-track generator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",   # small, typed local HTTP API for the UI
  "uvicorn>=0.29",    # ASGI server that runs FastAPI on 127.0.0.1
]

[project.optional-dependencies]
dev = [
  "pytest>=8",        # test runner
  "httpx>=0.27",      # required by FastAPI's TestClient
  "mypy>=1.10",       # static type checks
  "ruff>=0.5",        # lint + format
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge_worker*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.mypy]
strict = true
python_version = "3.11"
