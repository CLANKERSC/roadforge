[project]
name = "forge-worker"
version = "0.2.0"
description = "Local pipeline worker for the map-to-track generator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",   # small, typed local HTTP API for the UI
  "uvicorn>=0.29",    # ASGI server that runs FastAPI on 127.0.0.1
  "requests>=2.31",   # HTTP downloads
  "tenacity>=8.2",    # retries with backoff for flaky downloads
  "pyproj>=3.6",      # map projections (lat/lon <-> local metres)
  "shapely>=2.0",     # polygon maths: buffer, area, intersections
  "numpy>=1.26",      # raster arrays
  "rasterio>=1.3",    # read/crop GeoTIFFs, incl. remote cloud-optimised ones
  "scipy>=1.11",      # filters, distance transforms, interpolation
  "trimesh>=4.0",     # write the engine-neutral scene as GLB
]

[project.optional-dependencies]
dev = [
  "pytest>=8",        # test runner
  "httpx>=0.27",      # required by FastAPI's TestClient
  "mypy>=1.10",       # static type checks
  "ruff>=0.5",        # lint + format
  "types-requests",   # type stubs for mypy
  "types-shapely",    # type stubs for mypy
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge_worker*"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*", "scipy", "scipy.*", "trimesh", "trimesh.*"]
ignore_missing_imports = true
